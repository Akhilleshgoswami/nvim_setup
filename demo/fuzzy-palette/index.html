<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal Glass · Fuzzy Palette</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <button type="button" class="launch" id="launch">Open palette · Ctrl+P</button>

    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="palette" role="dialog" aria-modal="true" aria-label="Fuzzy file finder">
        <div class="body">
          <!-- LEFT: search + results (VS Code quick-open style) -->
          <aside class="sidebar-pane">
            <div class="search-bar">
              <span class="glyph" aria-hidden="true">⌕</span>
              <input
                id="search-input"
                type="text"
                placeholder="Search files by name…"
                autocomplete="off"
                spellcheck="false"
                aria-label="Search files"
              />
            </div>

            <div class="results-list" id="results-list">
              <div class="row-highlight" id="row-highlight"></div>
              <div id="rows"></div>
            </div>
          </aside>

          <!-- RIGHT: live file preview -->
          <main class="preview-pane hud-corners">
            <div class="preview-tab">
              <span class="tab-icon" id="preview-icon">◇</span>
              <span class="tab-title" id="preview-title">Preview</span>
              <span class="tab-meta" id="preview-meta">—</span>
            </div>
            <div class="preview-stack">
              <div class="preview-layer visible" id="preview-a">
                <div class="preview-empty">Pick a file to preview</div>
              </div>
              <div class="preview-layer" id="preview-b"></div>
            </div>
          </main>
        </div>

        <footer class="status-bar">
          <span class="count" id="result-count">0 results</span>
          <span class="mode-tag">Files</span>
          <span class="hints">
            <kbd>↑</kbd><kbd>↓</kbd> navigate
            <kbd>Enter</kbd> open
            <kbd>Esc</kbd> close
          </span>
        </footer>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
